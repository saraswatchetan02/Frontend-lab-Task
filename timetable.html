<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Timetable</title>
    <style>
        body {
           
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <header>
        <h1>Academic Timetable</h1>
        <p>B.Tech Computer Science</p>
    </header>
    <main>
<section>
    <h2>Weekly Timetable</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Day</th>
                <th>9:00 - 10:00</th>
                <th>10:00 - 11:00</th>
                <th>11:00 - 12:00</th>
                <th>12:00 - 1:00</th>
                <th>2:00 - 3:00</th>
                <th>3:00 - 4:00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>JavaScript</td>
                <td>Maths</td>
                <td>DBMS</td>
                <td>Java</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Java</td>
                <td>DBMS</td>
                <td>HTML</td>
                <td>Maths</td>
                <td>CSS</td>
                <td>JavaScript</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>CSS</td>
                <td>JavaScript</td>
                <td>Maths</td>
                <td>DBMS</td>
                <td>Java</td>
                <td>HTML</td>
                </tr>
        </tbody>
    </table>
</section>
    </main>
   
</body>
</html>
